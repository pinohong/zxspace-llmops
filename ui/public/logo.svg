<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E6BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形渐变背景 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- 中心光晕 -->
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>

  <!-- 三条环绕轨道与电子节点（智能空间意境） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.9">
    <ellipse cx="128" cy="128" rx="88" ry="30"/>
    <ellipse cx="128" cy="128" rx="88" ry="30" transform="rotate(60 128 128)"/>
    <ellipse cx="128" cy="128" rx="88" ry="30" transform="rotate(120 128 128)"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="216" cy="128" r="9"/>
    <circle cx="128" cy="98" r="9" transform="rotate(60 128 128)"/>
    <circle cx="216" cy="158" r="9" transform="rotate(120 128 128)"/>
  </g>

  <!-- 核心 -->
  <circle cx="128" cy="128" r="26" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="16" fill="#2E6BFF" opacity="0.85"/>
</svg>
