name: glm_image
label: 智谱文生图
description: 智谱的一个文生图模型绘图工具。
params:
  - name: size
    label: 图片尺寸
    type: select
    default: 1024x1024
    required: true
    options:
      - value: 1024x1024
        label: "(方)1024x1024"
      - value: 1792x1024
        label: "(横屏)1792x1024"
      - value: 1024x1792
        label: "(竖屏)1024x1792"
  - name: style
    label: 图片风格
    type: select
    default: vivid
    required: true
    options:
      - value: vivid
        label: "生动"
      - value: natural
        label: "自然"
  - name: quality
    label: 图片质量
    type: select
    default: standard
    required: true
    options:
      - value: standard
        label: "标准"
      - value: hd
        label: "高清"
  - name: watermark_enabled
    label: 水印
    type: boolean
    default: true
    required: false
